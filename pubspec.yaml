name: photolink_pc
description: PhotoLink（图联）PC端 - 局域网发现、浏览照片/视频、下载、删除、拖拽上传
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  bonsoir: ^5.1.11
  desktop_drop: ^0.6.0
  file_picker: ^10.2.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  window_manager: ^0.5.0
  cross_file: ^0.3.4+2
  qr_flutter: ^4.1.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^6.1.4
  crypto: ^3.0.6
  tray_manager: ^0.5.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/certs/
    - assets/icons/

flutter_launcher_icons:
  android: false
  ios: false
  image_path: assets/icons/app_icon.png
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 256
